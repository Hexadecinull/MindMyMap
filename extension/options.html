<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MindMyMap — Extension Settings</title>
  <style>
    :root { --primary: #4F46E5; --gray-100: #F3F4F6; --gray-200: #E5E7EB; --gray-700: #374151; --gray-900: #111827; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background: var(--gray-100); color: var(--gray-900); padding: 32px; min-height: 100vh; }
    .card { background: #fff; border-radius: 14px; padding: 28px 32px; max-width: 540px; margin: 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .brand { font-size: 22px; font-weight: 800; margin-bottom: 24px; }
    .brand em { font-style: normal; color: var(--primary); }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--gray-700); margin-bottom: 6px; }
    input[type=url], input[type=text] {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--gray-200);
      border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 16px;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.12); }
    button {
      background: var(--primary); color: #fff; border: none; border-radius: 8px;
      padding: 10px 20px; font-size: 14px; font-weight: 500; cursor: pointer;
    }
    button:hover { background: #3730A3; }
    .saved { color: #10B981; font-size: 13px; margin-left: 10px; opacity: 0; transition: opacity 0.3s; }
    .saved.show { opacity: 1; }
    .credit { font-size: 12px; color: #9CA3AF; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--gray-200); }
    .credit a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Mind<em>My</em>Map Settings</div>

    <label for="server">Server URL</label>
    <input type="url" id="server" placeholder="https://mindmymap.ct.ws/" />

    <div>
      <button id="save">Save settings</button>
      <span class="saved" id="saved-msg">✓ Saved</span>
    </div>

    <div class="credit">
      <p>MindMyMap — Free, open-source, ad-free mind mapping.</p>
      <p>Based on <a href="https://ladigitale.dev/digimindmap/" target="_blank">Digimindmap by La Digitale</a> · Inspired by <a href="https://gitmind.com" target="_blank">GitMind</a> · License: AGPL-3.0</p>
    </div>
  </div>

  <script>
    const serverInput = document.getElementById('server')
    const saveBtn = document.getElementById('save')
    const savedMsg = document.getElementById('saved-msg')

    chrome.storage.sync.get(['serverUrl'], res => {
      serverInput.value = res.serverUrl || 'https://mindmymap.ct.ws/'
    })

    saveBtn.addEventListener('click', () => {
      const url = serverInput.value.trim().replace(/\/?$/, '/')
      chrome.storage.sync.set({ serverUrl: url }, () => {
        savedMsg.classList.add('show')
        setTimeout(() => savedMsg.classList.remove('show'), 2000)
      })
    })
  </script>
</body>
</html>
