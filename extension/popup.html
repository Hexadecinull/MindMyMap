<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindMyMap</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-dark: #3730A3;
      --accent: #7C3AED;
      --gray-50: #F9FAFB;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-500: #6B7280;
      --gray-700: #374151;
      --gray-900: #111827;
      --sidebar: #1E1F2B;
      --danger: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { width: 340px; background: var(--gray-50); color: var(--gray-900); }

    /* Header */
    .header {
      background: linear-gradient(135deg, #0F0C29, #302B63);
      padding: 16px 18px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 32px; height: 32px; border-radius: 9px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .logo svg { width: 18px; height: 18px; fill: #fff; }
    .brand { color: #fff; font-size: 16px; font-weight: 700; }
    .brand em { font-style: normal; color: #818CF8; }
    .tagline { color: rgba(255,255,255,0.55); font-size: 11px; margin-top: 1px; }

    /* Body */
    .body { padding: 14px 14px 6px; display: flex; flex-direction: column; gap: 8px; }

    /* Server row */
    .server-row {
      display: flex; align-items: center; gap: 8px;
      background: #fff; border: 1.5px solid var(--gray-200);
      border-radius: 8px; padding: 8px 10px;
    }
    .server-row input {
      flex: 1; border: none; outline: none; font-size: 13px;
      color: var(--gray-700); background: transparent;
    }
    .server-row button {
      background: var(--primary); color: #fff; border: none;
      border-radius: 6px; padding: 5px 10px; font-size: 12px;
      font-weight: 500; cursor: pointer; white-space: nowrap;
      transition: background 0.15s;
    }
    .server-row button:hover { background: var(--primary-dark); }

    /* Action buttons */
    .btn {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; border-radius: 8px; cursor: pointer;
      border: none; text-align: left; width: 100%;
      font-size: 14px; font-weight: 500; transition: all 0.15s;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff; box-shadow: 0 2px 8px rgba(79,70,229,0.3);
    }
    .btn-primary:hover { box-shadow: 0 4px 14px rgba(79,70,229,0.4); transform: translateY(-1px); }
    .btn-secondary { background: #fff; color: var(--gray-700); border: 1.5px solid var(--gray-200); }
    .btn-secondary:hover { background: var(--gray-50); border-color: var(--primary); color: var(--primary); }

    .btn .icon {
      width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .btn-primary .icon { background: rgba(255,255,255,0.18); }
    .btn-secondary .icon { background: var(--gray-100); }
    .btn .label { flex: 1; }
    .btn .sub { font-size: 11px; opacity: 0.7; font-weight: 400; display: block; }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: var(--gray-500);
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--gray-200);
    }

    /* Recent maps */
    .section-title { font-size: 11px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.05em; }
    .map-list { display: flex; flex-direction: column; gap: 4px; }
    .map-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 7px; cursor: pointer;
      transition: background 0.12s; text-decoration: none; color: var(--gray-700);
      background: #fff; border: 1px solid var(--gray-200);
    }
    .map-item:hover { background: #EEF2FF; border-color: var(--primary); color: var(--primary); }
    .map-item .map-icon { font-size: 14px; flex-shrink: 0; }
    .map-item .map-name { flex: 1; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .map-item .map-id { font-size: 10px; color: var(--gray-500); flex-shrink: 0; font-family: monospace; }
    .map-item .map-del { font-size: 14px; color: var(--gray-500); cursor: pointer; padding: 0 2px; }
    .map-item .map-del:hover { color: var(--danger); }

    .empty-state { text-align: center; padding: 16px; color: var(--gray-500); font-size: 13px; }

    /* Footer */
    .footer {
      padding: 10px 14px;
      border-top: 1px solid var(--gray-200);
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer a { font-size: 11px; color: var(--gray-500); text-decoration: none; }
    .footer a:hover { color: var(--primary); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #10B981; display: inline-block; margin-right: 4px; }
    .status-dot.offline { background: var(--danger); }
    .status-label { font-size: 11px; color: var(--gray-500); display: flex; align-items: center; gap: 3px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-2.5-4.5l7-3.5-7-3.5v7z"/>
      </svg>
    </div>
    <div>
      <div class="brand">Mind<em>My</em>Map</div>
      <div class="tagline">Free · Open Source · No Ads</div>
    </div>
  </div>

  <div class="body">
    <!-- Server config -->
    <div class="server-row">
      <input type="url" id="server-url" placeholder="https://your-mindmymap-server.com/" />
      <button id="save-server">Save</button>
    </div>

    <!-- New map -->
    <a id="open-app" href="#" class="btn btn-primary">
      <div class="icon">🧠</div>
      <div class="label">
        Open MindMyMap
        <span class="sub">Create or view your mind maps</span>
      </div>
    </a>

    <div class="divider">Recent maps</div>

    <!-- Recent maps -->
    <div class="map-list" id="map-list">
      <div class="empty-state">No recent maps yet.<br>Create one to get started!</div>
    </div>
  </div>

  <div class="footer">
    <div class="status-label">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Checking…</span>
    </div>
    <div style="display:flex;gap:12px">
      <a href="options.html" target="_blank">Settings</a>
      <a href="https://github.com/mindmymap/mindmymap" target="_blank">GitHub</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
