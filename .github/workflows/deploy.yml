name: Deploy to InfinityFree

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mindmymap.ct.ws

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build (dist mode)
        working-directory: web
        run: npm run build:dist

      - name: Write .env from secrets
        run: printf 'AUTHORIZED_DOMAINS=%s\n' '${{ secrets.AUTHORIZED_DOMAINS }}' > web/dist/.env

      - name: Verify dist output
        run: |
          for f in web/dist/index.html web/dist/.htaccess web/dist/.env web/dist/inc/db.php; do
            [ -f "$f" ] || { echo "::error::Missing: $f"; exit 1; }
          done

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:     ${{ secrets.FTP_HOST }}
          username:   ${{ secrets.FTP_USER }}
          password:   ${{ secrets.FTP_PASS }}
          local-dir:  ./web/dist/
          server-dir: /mindmymap.ct.ws/htdocs/
          exclude: |
            **/.git*
            **/node_modules/**
            **/*.db
            **/*.sqlite
            **/*.db-shm
            **/*.db-wal
          dangerous-clean-slate: false
          log-level: verbose

      - name: Smoke test
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 20 https://mindmymap.ct.ws || echo "000")
          [ "$STATUS" = "200" ] && echo "✅ Site is up." || echo "::warning::Site returned status $STATUS — it may still be propagating."
