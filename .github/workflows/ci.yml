name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-web:
    name: Lint (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint -- --max-warnings=0

  build-web:
    name: Build (web)
    runs-on: ubuntu-latest
    needs: lint-web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: echo "AUTHORIZED_DOMAINS=" > .env
      - run: npm run build:dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: web/dist/
          retention-days: 7

  validate-extension:
    name: Validate extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest.json
        run: |
          python3 -c "
          import json
          with open('extension/manifest.json') as f:
              m = json.load(f)
          assert m['manifest_version'] == 3
          assert 'name' in m and 'version' in m
          assert 'browser_specific_settings' in m
          print('manifest.json OK')
          "

  validate-mobile:
    name: Validate mobile (Capacitor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Validate capacitor.config.json
        run: |
          python3 -c "
          import json
          with open('capacitor.config.json') as f:
              c = json.load(f)
          assert 'appId' in c and 'appName' in c and 'webDir' in c
          print('capacitor.config.json OK:', c['appId'])
          "
      - name: Check Capacitor CLI works
        run: npx cap --version

  audit-desktop:
    name: Audit (desktop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
        continue-on-error: true
