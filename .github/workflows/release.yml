name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-web:
    name: Build web dist
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: echo "AUTHORIZED_DOMAINS=" > .env
      - run: npm run build:dist
      - name: Zip web dist
        run: |
          mkdir -p ../../release-artifacts
          cd dist && zip -r ../../release-artifacts/mindmymap-web-${{ github.ref_name }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: release-artifacts/

  package-extension:
    name: Package extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip extension
        run: |
          mkdir -p release-artifacts
          cd extension && zip -r ../release-artifacts/mindmymap-extension-${{ github.ref_name }}.zip . \
            --exclude "*.md" "*.git*"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: release-artifacts/

  mobile-android:
    name: Mobile (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build web app
        working-directory: web
        run: |
          echo "AUTHORIZED_DOMAINS=" > .env
          npm run build:dist

      - name: Init android project if not committed
        working-directory: web
        run: |
          if [ ! -d "android" ]; then
            npx cap add android --no-confirm 2>/dev/null || npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: web
        run: npx cap sync android

      - name: Build debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release-artifacts
          find web/android/app/build/outputs/apk/debug -name "*.apk" \
            -exec cp {} release-artifacts/mindmymap-${{ github.ref_name }}.apk \;

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: release-artifacts/

  desktop-linux:
    name: Desktop (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update -y && sudo apt-get install -y rpm
      - run: npm ci
      - name: Build
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect artifacts
        run: |
          mkdir -p ../../release-artifacts
          find dist/ \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) \
            -exec cp {} ../../release-artifacts/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: release-artifacts/

  desktop-windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "..\..\release-artifacts"
          Get-ChildItem -Path "dist\" -Include "*.exe","*.msi" -Recurse |
            Copy-Item -Destination "..\..\release-artifacts\"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: release-artifacts/

  desktop-macos:
    name: Desktop (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Collect artifacts
        run: |
          mkdir -p ../../release-artifacts
          find dist/ -name "*.dmg" -exec cp {} ../../release-artifacts/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: release-artifacts/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - build-web
      - package-extension
      - mobile-android
      - desktop-linux
      - desktop-windows
      - desktop-macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "MindMyMap ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## MindMyMap ${{ github.ref_name }}

            Free, open-source, ad-free mind mapping — inspired by GitMind, built on Digimindmap by La Digitale.

            | Package | Platform |
            |---|---|
            | `mindmymap-web-*.zip` | Self-hosted web app (InfinityFree or any PHP host) |
            | `mindmymap-extension-*.zip` | Browser extension (Chrome, Firefox, Edge, Opera) |
            | `mindmymap-*.apk` | Android |
            | `*.AppImage` / `*.deb` / `*.rpm` | Linux desktop |
            | `*.exe` | Windows desktop |
            | `*.dmg` | macOS desktop |

            **AGPL-3.0** — Based on [Digimindmap by La Digitale](https://ladigitale.dev/digimindmap/). Inspired by [GitMind](https://gitmind.com).
          files: all-artifacts/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
